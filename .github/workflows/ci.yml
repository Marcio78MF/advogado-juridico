name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar-plugin:
    name: Validar estrutura do plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar manifesto, skills, hook e blueprint
        run: bash scripts/validate.sh
      - name: Testar roteamento do hook
        run: bash scripts/test-roteamento.sh

  shellcheck:
    name: ShellCheck (hooks e scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar ShellCheck
        run: shellcheck hooks/*.sh scripts/*.sh

  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
